RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIpV6.list,中国网站
GEOIP,CN,中国网站
FINAL,代理


[Host]
# Tailscale 的 MagicDNS 解析
*.ts.net = 100.100.100.100
localhost = 127.0.0.1


[URL Rewrite]
# 通用 Google 中国域名跳转。
^https?://(www.)?g\.cn https://www.google.com 302
^https?://(www.)?google\.cn https://www.google.com 302


